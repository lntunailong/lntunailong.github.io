name: Deploy static site to GitHub Pages

# 推送到 main 就自动发布；也可以在 Actions 页面手动点运行。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能发布 Pages。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；不打断正在进行的发布。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # 整个仓库根目录就是网站。该动作会自动排除 .git 和 .github。
      # 想发布以点开头的隐藏文件，加上 include-hidden-files: true。
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
