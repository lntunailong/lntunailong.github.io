<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>辽宁奶龙大学</title>
<link rel="icon" href="2.png" />
<style>
  /* ==========================================================
     辽宁奶龙大学 · 旋转跳转页
     两张校徽叠在一起同步逆时针旋转，加速到最快时换图，
     再减速停稳，最后跳转到学校官网。
     ========================================================== */

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 4.5vh, 36px);
    /* 校徽是白底方形，所以页面也用白色，图片边缘自然融进背景 */
    background: #ffffff;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Source Han Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
    overflow: hidden;
  }

  /* ---------- 旋转舞台 ----------
     两张图共用一个容器，容器一转，两张图就严格同步 */
  .stage {
    position: relative;
    width: min(64vw, 300px);
    height: min(64vw, 300px);
    transform: rotate(0deg);          /* 初始 0 度 */
    transform-origin: 50% 50%;
    will-change: transform;
    backface-visibility: hidden;
  }

  .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* 初始状态：1.png 完全不透明，2.png 完全透明 */
  #img1 { opacity: 1; }
  #img2 { opacity: 0; }

  /* ---------- 文字 ---------- */
  .title {
    margin: 0;
    font-size: clamp(1.8rem, 6.2vw, 3rem);
    font-weight: 800;
    letter-spacing: .02em;
    color: #1f2430;
    white-space: nowrap;
  }

  /* 只有 "top" 三个字母用彩色渐变 */
  .tld {
    color: #e0553f;                    /* 极老浏览器不支持渐变文字时的兜底色 */
    background-image: linear-gradient(90deg,
      #ff4d4d, #ff9a3c, #ffe14d, #4ade80, #38bdf8, #a78bfa, #ff4d4d,
      #ff9a3c, #ffe14d, #4ade80, #38bdf8, #a78bfa, #ff4d4d);
    /* 渐变图画成 2 倍宽、内含 2 个完全相同色环；
       窗口正好显示 1 个色环，位移一整个色环宽度后画面与起点完全一致 —— 无缝循环 */
    background-size: 200% 100%;
    background-position: 0% 50%;
    background-repeat: no-repeat;
    animation: tld-flow 3.6s linear infinite;
  }

  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .tld {
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
  }

  @keyframes tld-flow {
    from { background-position:   0% 50%; }
    to   { background-position: 100% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tld { animation: none; }
  }

  /* ---------- JS 关闭时的兜底 ---------- */
  .fallback {
    margin: 0;
    font-size: .95rem;
    color: #6b7280;
    text-align: center;
  }
  .fallback a { color: #2563eb; }
</style>
</head>
<body>

  <div class="stage" id="stage">
    <img id="img1" src="1.png" alt="辽宁工程技术大学校徽" />
    <img id="img2" src="2.png" alt="辽宁工程技术大学校徽" />
  </div>

  <p class="title">辽宁奶龙大学.<span class="tld">top</span></p>

  <noscript>
    <p class="fallback">
      动画需要启用 JavaScript。<a href="https://www.lntu.edu.cn/">点此前往学校官网</a>
    </p>
  </noscript>

<script>
(function () {
  'use strict';

  /* ================= 可调参数 ================= */
  var SPIN_MS = 2500;      // 旋转总时长：2.5 秒
  var WAIT_MS = 500;       // 停稳后等待 0.5 秒再跳转
  var TURNS   = 4;         // 旋转整圈数（必须是整数，才能保证最后回到 0°）
  var TARGET  = 'https://www.lntu.edu.cn/';

  /* 换图的时间窗，取值 0~1，相对旋转进度。
     结束点 0.50 = 速度峰值所在时刻，
     所以「速度最快」的那一刻恰好是 1.png 全透明、2.png 全不透明。 */
  var FADE_FROM = 0.32;
  var FADE_TO   = 0.50;
  /* ============================================ */

  var TOTAL_DEG = TURNS * 360;   // 4 圈 = 1440°，是 360 的整数倍 → 终点天然是 0°

  var stage = document.getElementById('stage');
  var img1  = document.getElementById('img1');
  var img2  = document.getElementById('img2');

  /* 先加速、后减速，速度峰值正好落在 t = 0.5。
     两端速度均为 0，所以起步和收尾都是平滑的，不会有突兀的启停。 */
  function easeInOutCubic(t) {
    return t < 0.5
      ? 4 * t * t * t
      : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function smoothstep(x) { return x * x * (3 - 2 * x); }

  function render(t) {
    /* 逆时针旋转 = 负角度。
       CSS 的 rotate() 正角度是顺时针，所以这里取负。 */
    var eased = easeInOutCubic(t);
    stage.style.transform = 'rotate(' + (-TOTAL_DEG * eased) + 'deg)';

    /* 交叉淡出淡入：t = 0.50 时 f = 1，
       即 1.png opacity = 0、2.png opacity = 1。 */
    var f = smoothstep(clamp01((t - FADE_FROM) / (FADE_TO - FADE_FROM)));
    img1.style.opacity = 1 - f;
    img2.style.opacity = f;
  }

  function settle() {
    /* 明确钉死在 0 度。
       -TOTAL_DEG 本身已经是 360 的整数倍（视觉上就是 0°），
       这里再显式写一次，确保最终的计算样式就是 rotate(0deg)。 */
    stage.style.transform = 'rotate(0deg)';
    img1.style.opacity = 0;
    img2.style.opacity = 1;
  }

  var started = false;

  function start() {
    if (started) return;
    started = true;

    var startAt = performance.now();

    function frame(now) {
      var t = clamp01((now - startAt) / SPIN_MS);
      render(t);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        settle();
      }
    }

    /* 初始帧先画出来，避免起手闪一下 */
    render(0);
    requestAnimationFrame(frame);

    /* 跳转用独立计时器，不受刷新率影响：
       2.5 秒旋转 + 0.5 秒等待 = 3 秒后跳转 */
    setTimeout(function () {
      window.location.replace(TARGET);
    }, SPIN_MS + WAIT_MS);
  }

  /* 等两张图都就绪再开始，避免第一帧还是空白。
     load 事件即使某张图 404 也会触发，所以不会卡死。 */
  if (document.readyState === 'complete') {
    start();
  } else {
    window.addEventListener('load', start, { once: true });
    /* 兜底：万一 load 迟迟不来，也不至于一直不跳转 */
    setTimeout(start, 2500);
  }
})();
</script>
</body>
</html>
